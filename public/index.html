<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>홀덤 AI 대전</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 홈 화면 -->
<section id="screen-home" class="screen active">
  <div class="card">
    <h1>♠ 홀덤 AI 대전</h1>
    <p class="sub">GTO 기반 AI와 함께하는 나만의 홀덤 테이블</p>
    <button id="btn-go-create" class="btn primary">새 게임 만들기</button>
    <button id="btn-go-join" class="btn secondary">방 코드로 참가하기</button>
  </div>
</section>

<!-- 방 만들기 -->
<section id="screen-create" class="screen">
  <div class="card wide">
    <h2>새 게임 만들기</h2>
    <label>내 닉네임
      <input id="create-name" type="text" placeholder="닉네임" maxlength="12" />
    </label>

    <div class="grid2">
      <label>AI 인원수 (<span id="ai-count-label">3</span>명)
        <input id="create-aiCount" type="range" min="0" max="7" value="3" />
      </label>
      <label>AI 실수 빈도 (<span id="ai-mistake-label">8</span>%)
        <input id="create-aiMistake" type="range" min="0" max="30" value="8" />
      </label>
    </div>

    <div class="grid2">
      <label>시작 칩
        <input id="create-startingStack" type="number" value="5000" min="100" step="100" />
      </label>
      <label>리바인 칩
        <input id="create-rebuyAmount" type="number" value="5000" min="100" step="100" />
      </label>
    </div>

    <div class="grid2">
      <label>시작 스몰블라인드
        <input id="create-sb" type="number" value="25" min="1" />
      </label>
      <label>시작 빅블라인드
        <input id="create-bb" type="number" value="50" min="2" />
      </label>
    </div>

    <label>블라인드 상승 주기 (분, 0=고정)
      <input id="create-levelMinutes" type="number" value="15" min="0" max="180" />
    </label>

    <div class="row-buttons">
      <button id="btn-create-submit" class="btn primary">방 만들기</button>
      <button class="btn ghost btn-back">뒤로</button>
    </div>
  </div>
</section>

<!-- 참가하기 -->
<section id="screen-join" class="screen">
  <div class="card">
    <h2>방 코드로 참가하기</h2>
    <label>내 닉네임
      <input id="join-name" type="text" placeholder="닉네임" maxlength="12" />
    </label>
    <label>방 코드
      <input id="join-code" type="text" placeholder="예: AB12CD" maxlength="8" style="text-transform:uppercase" />
    </label>
    <div class="row-buttons">
      <button id="btn-join-submit" class="btn primary">참가하기</button>
      <button class="btn ghost btn-back">뒤로</button>
    </div>
  </div>
</section>

<!-- 로비 -->
<section id="screen-lobby" class="screen">
  <div class="card wide">
    <h2>대기실</h2>
    <p>방 코드: <span id="lobby-roomcode" class="room-code"></span> <button id="btn-copy-code" class="btn tiny">복사</button></p>
    <p class="hint">이 코드를 친구에게 공유하면 함께 플레이할 수 있어요 (최대 1명 추가 참가).</p>
    <ul id="lobby-seats" class="seat-list"></ul>
    <div class="row-buttons">
      <button id="btn-start-game" class="btn primary">게임 시작</button>
      <span id="lobby-wait-msg" class="hint"></span>
    </div>
  </div>
</section>

<!-- 테이블 -->
<section id="screen-table" class="screen">
  <div class="table-top">
    <div id="blind-info" class="blind-info"></div>
    <button id="btn-leave" class="btn tiny ghost">방 나가기</button>
  </div>

  <div class="table-wrap">
    <div id="table-oval" class="table-oval">
      <div id="board-cards" class="board-cards"></div>
      <div id="pot-display" class="pot-display"></div>
      <div id="seats-container"></div>
    </div>
  </div>

  <div id="hand-result-banner" class="hand-result-banner hidden"></div>

  <div id="action-bar" class="action-bar hidden">
    <div class="raise-controls">
      <input id="raise-slider" type="range" min="0" max="0" value="0" />
      <span id="raise-amount-label">0</span>
    </div>
    <div class="action-buttons">
      <button id="btn-fold" class="btn danger">폴드</button>
      <button id="btn-check" class="btn secondary">체크</button>
      <button id="btn-call" class="btn secondary">콜</button>
      <button id="btn-raise" class="btn primary">레이즈</button>
      <button id="btn-allin" class="btn warn">올인</button>
    </div>
  </div>
</section>

<!-- 리바인 모달 -->
<div id="rebuy-modal" class="modal hidden">
  <div class="modal-box">
    <h3>칩이 모두 소진되었습니다</h3>
    <p id="rebuy-msg">다시 리바인하고 계속 플레이하시겠어요?</p>
    <div class="row-buttons">
      <button id="btn-rebuy-yes" class="btn primary">리바인하고 계속</button>
      <button id="btn-rebuy-no" class="btn ghost">그만하기</button>
    </div>
  </div>
</div>

<!-- 방 종료 모달 -->
<div id="closed-modal" class="modal hidden">
  <div class="modal-box">
    <h3>게임이 종료되었습니다</h3>
    <p id="closed-msg"></p>
    <button id="btn-back-home" class="btn primary">새 게임 열기</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
